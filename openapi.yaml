openapi: 3.0.3
info:
  title: NovaMarket Store Service
  description: Internal store service contract. Public clients use NovaApiGateway.
  version: 1.0.0
servers:
  - url: http://localhost:3004
    description: Local development
tags:
  - name: System
    description: Common service health and monitoring endpoints
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /ready:
    get:
      tags: [System]
      operationId: getReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponse' }
        '503':
          description: Service is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotReadyResponse' }
  /version:
    get:
      tags: [System]
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema: { type: string }

  /stores:
    get:
      tags: [Catalog]
      summary: List public stores
      security: []
      parameters:
      - {$ref: '#/components/parameters/SearchParam'}
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/LimitParam'}
      - name: location
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Store list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/StoreSummary'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
components:
  parameters:
    PageParam:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    LimitParam:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor for pagination
    SearchParam:
      name: search
      in: query
      schema: {type: string}
    IdParam:
      name: id
      in: path
      required: true
      schema: {type: string}
  schemas:
    StoreSummary:
      type: object
      required: [id, name, slug, logoUrl, verified, rating, reviewsCount, productsCount]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        logoUrl: {type: string, nullable: true}
        verified: {type: boolean}
        rating: {type: number, minimum: 0, maximum: 5}
        reviewsCount: {type: integer}
        productsCount: {type: integer}
    PaginationMeta:
      type: object
      properties:
        page: {type: integer, example: 1}
        limit: {type: integer, example: 20}
        total: {type: integer, example: 96}
        totalPages: {type: integer, example: 5}
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready] }
        checks: { type: object, additionalProperties: { type: string } }
    NotReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [not_ready] }
        checks: { type: object, additionalProperties: { type: string } }
    VersionResponse:
      type: object
      required: [service, version, commit]
      properties:
        service: { type: string }
        version: { type: string }
        commit: { type: string }
